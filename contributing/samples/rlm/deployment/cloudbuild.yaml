steps:
  # Pull the latest image to use as cache
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/adk-rlm/web:latest || true'

  # Build the container image with cache
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/adk-rlm/web:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adk-rlm/web:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adk-rlm/web:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/adk-rlm/web'

  # Deploy to Cloud Run with IAP enabled (beta feature)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'beta'
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/adk-rlm/web:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--concurrency=80'
      - '--no-allow-unauthenticated'
      - '--iap'
      - '--service-account=adk-rlm-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars=RLM_MODEL=gemini-3-pro-preview,RLM_MAX_ITERATIONS=30'

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: adk-rlm

options:
  machineType: 'E2_HIGHCPU_8'
