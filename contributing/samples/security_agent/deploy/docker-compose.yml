# GCP Security Agent - Local Development Environment
# Docker Compose configuration for local development and testing

version: '3.8'

services:
  # ===================================
  # BACKEND API SERVICE
  # ===================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: security-agent-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-mgm-digitalconcierge}
      - VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID:-mgm-digitalconcierge}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-us-central1}
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - ENABLE_MONITORING=true
      - PERFORMANCE_MONITORING_ENABLED=true
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - gcp-credentials:/credentials
    depends_on:
      - redis
      - prometheus
    networks:
      - security-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # FRONTEND SERVICE
  # ===================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: security-agent-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend
    networks:
      - security-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # REDIS CACHE SERVICE
  # ===================================
  redis:
    image: redis:7-alpine
    container_name: security-agent-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - security-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===================================
  # MONITORING SERVICES
  # ===================================
  prometheus:
    image: prom/prometheus:latest
    container_name: security-agent-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - security-agent-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: security-agent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - security-agent-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # ===================================
  # LOG AGGREGATION SERVICE
  # ===================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: security-agent-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - security-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: security-agent-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - security-agent-network
    restart: unless-stopped

  # ===================================
  # TESTING SERVICE
  # ===================================
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: security-agent-tests
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-test-project}
      - TEST_MODE=true
      - BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - test-results:/app/test-results
    depends_on:
      - backend
      - redis
    networks:
      - security-agent-network
    profiles:
      - testing
    command: ["pytest", "tests/", "-v", "--html=test-results/report.html"]

# ===================================
# NETWORKS
# ===================================
networks:
  security-agent-network:
    driver: bridge
    name: security-agent-net

# ===================================
# VOLUMES
# ===================================
volumes:
  redis-data:
    driver: local
    name: security-agent-redis-data

  prometheus-data:
    driver: local
    name: security-agent-prometheus-data

  grafana-data:
    driver: local
    name: security-agent-grafana-data

  elasticsearch-data:
    driver: local
    name: security-agent-elasticsearch-data

  gcp-credentials:
    driver: local
    name: security-agent-gcp-credentials

  test-results:
    driver: local
    name: security-agent-test-results

# ===================================
# DEVELOPMENT CONFIGURATION FILES
# ===================================
# Additional configuration files:
#
# Dockerfile.dev (Development Backend)
# FROM python:3.11-slim
# WORKDIR /app
# COPY requirements.txt .
# RUN pip install -r requirements.txt
# COPY . .
# EXPOSE 8000
# CMD ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
#
# Dockerfile.frontend (Development Frontend)
# FROM python:3.11-slim
# WORKDIR /app
# COPY requirements.txt .
# RUN pip install -r requirements.txt streamlit
# COPY frontend/ ./frontend/
# EXPOSE 8501
# CMD ["streamlit", "run", "frontend/main_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
#
# Dockerfile.test (Testing)
# FROM python:3.11-slim
# WORKDIR /app
# COPY requirements.txt requirements-dev.txt ./
# RUN pip install -r requirements.txt -r requirements-dev.txt
# COPY . .
# CMD ["pytest"]

# ===================================
# USAGE INSTRUCTIONS
# ===================================
# 1. Copy .env.example to .env and configure your settings
# 2. Ensure you have Google Cloud credentials configured
# 3. Start the development environment:
#    docker-compose up -d
#
# 4. Access services:
#    - Backend API: http://localhost:8000
#    - Frontend UI: http://localhost:8501
#    - API Documentation: http://localhost:8000/docs
#    - Prometheus: http://localhost:9090
#    - Grafana: http://localhost:3000 (admin/admin)
#    - Kibana: http://localhost:5601
#
# 5. Run tests:
#    docker-compose --profile testing up test-runner
#
# 6. View logs:
#    docker-compose logs -f backend
#    docker-compose logs -f frontend
#
# 7. Stop all services:
#    docker-compose down
#
# 8. Clean up volumes (destructive):
#    docker-compose down -v
#
# ===================================
# PRODUCTION CONSIDERATIONS
# ===================================
# For production deployment:
# 1. Use Google Cloud Run instead of Docker Compose
# 2. Use Google Cloud Memorystore for Redis
# 3. Use Google Cloud Monitoring instead of Prometheus/Grafana
# 4. Use Google Cloud Logging instead of ELK stack
# 5. Configure proper secrets management
# 6. Set up proper backup and disaster recovery
# 7. Configure load balancing and auto-scaling