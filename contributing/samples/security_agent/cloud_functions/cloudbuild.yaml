# Cloud Build configuration for Cloud Functions CI/CD pipeline
# Automatically tests, scans, and deploys Cloud Functions on push to main branch

steps:
  # Step 1: Install test dependencies
  - name: 'python:3.11'
    id: 'install-dependencies'
    entrypoint: 'pip'
    args: ['install', '-r', 'cloud_functions/tests/requirements.txt']
    waitFor: ['-']

  # Step 2: Run unit tests with coverage
  - name: 'python:3.11'
    id: 'unit-tests'
    entrypoint: 'python'
    args: ['cloud_functions/tests/run_tests.py', '--unit-only', '-v']
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BQ_DATASET_ID=security_insights'
      - 'TESTING=true'
    waitFor: ['install-dependencies']

  # Step 3: Run security scans
  - name: 'python:3.11'
    id: 'security-scan'
    entrypoint: 'python'
    args: ['cloud_functions/tests/run_tests.py', '--security-only', '-v']
    waitFor: ['install-dependencies']

  # Step 4: Run integration tests (parallel with security)
  - name: 'python:3.11'
    id: 'integration-tests'
    entrypoint: 'python'
    args: ['cloud_functions/tests/run_tests.py', '--integration-only', '-q']
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BQ_DATASET_ID=security_insights'
      - 'REGION=us-central1'
    waitFor: ['unit-tests']

  # Step 5: Deploy IAM functions (only if all tests pass)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    id: 'deploy-iam-functions'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Deploy all IAM-related functions in parallel
        gcloud functions deploy fetch_custom_roles \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_custom_roles \
          --entry-point=fetch_custom_roles \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=512MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        gcloud functions deploy fetch_user_roles \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_user_roles \
          --entry-point=fetch_user_roles \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=512MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        gcloud functions deploy fetch_service_account_roles \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_service_account_roles \
          --entry-point=fetch_service_account_roles \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=512MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        gcloud functions deploy fetch_standard_roles \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_standard_roles \
          --entry-point=fetch_standard_roles \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=512MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        # Wait for all deployments to complete
        wait
        echo "IAM functions deployed successfully"
    waitFor: ['unit-tests', 'security-scan']

  # Step 6: Deploy infrastructure functions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    id: 'deploy-infrastructure-functions'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Deploy all infrastructure-related functions in parallel
        gcloud functions deploy fetch_compute_instances \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_compute_instances \
          --entry-point=fetch_compute_instances \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=512MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        gcloud functions deploy fetch_firewall_rules \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_firewall_rules \
          --entry-point=fetch_firewall_rules \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=512MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        gcloud functions deploy fetch_storage_buckets \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_storage_buckets \
          --entry-point=fetch_storage_buckets \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=512MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        gcloud functions deploy fetch_security_findings \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_security_findings \
          --entry-point=fetch_security_findings \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=512MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        gcloud functions deploy fetch_iam_accounts \
          --gen2 --runtime=python311 --region=us-central1 \
          --source=cloud_functions/fetch_iam_accounts \
          --entry-point=fetch_iam_accounts \
          --trigger-http --allow-unauthenticated \
          --timeout=540s --memory=1024MB \
          --set-env-vars="PROJECT_ID=$PROJECT_ID,BQ_DATASET_ID=security_insights" \
          --project=$PROJECT_ID &

        # Wait for all deployments to complete
        wait
        echo "Infrastructure functions deployed successfully"
    waitFor: ['deploy-iam-functions']

  # Step 7: Post-deployment integration tests
  - name: 'python:3.11'
    id: 'post-deployment-tests'
    entrypoint: 'python'
    args: ['cloud_functions/tests/run_tests.py', '--integration-only', '-v']
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BQ_DATASET_ID=security_insights'
      - 'REGION=us-central1'
    waitFor: ['deploy-infrastructure-functions']

  # Step 8: Generate and upload test reports
  - name: 'python:3.11'
    id: 'generate-reports'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Generate comprehensive test report
        python cloud_functions/tests/run_tests.py -v

        # Upload test artifacts to Cloud Storage (optional)
        if [ ! -z "$_ARTIFACTS_BUCKET" ]; then
          gsutil cp cloud_functions/tests/test_report.json gs://$_ARTIFACTS_BUCKET/test-reports/
          gsutil cp cloud_functions/tests/coverage.json gs://$_ARTIFACTS_BUCKET/test-reports/
          gsutil cp cloud_functions/tests/*.xml gs://$_ARTIFACTS_BUCKET/test-reports/
        fi

        echo "Test reports generated and uploaded"
    waitFor: ['post-deployment-tests']

# Build options
options:
  # Use high-CPU machine for faster builds
  machineType: 'E2_HIGHCPU_8'

  # Set environment variables
  env:
    - 'PYTHONPATH=/workspace'
    - 'CLOUDSDK_PYTHON_SITEPACKAGES=1'

  # Enable logging
  logging: CLOUD_LOGGING_ONLY

  # Set timeout (30 minutes)
  timeout: '1800s'

# Timeout for the entire build
timeout: '1800s'

# Substitutions (can be overridden when triggering build)
substitutions:
  _ARTIFACTS_BUCKET: ''  # Optional: GCS bucket for storing test artifacts
  _NOTIFICATION_TOPIC: ''  # Optional: Pub/Sub topic for notifications

# Build triggers configuration
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/test-service-account/versions/latest
      env: 'GOOGLE_APPLICATION_CREDENTIALS_JSON'

# Success/failure actions
logsBucket: 'gs://${_ARTIFACTS_BUCKET}/build-logs'

# Build artifacts
artifacts:
  objects:
    location: 'gs://${_ARTIFACTS_BUCKET}/artifacts'
    paths:
      - 'cloud_functions/tests/test_report.json'
      - 'cloud_functions/tests/coverage.json'
      - 'cloud_functions/tests/*.xml'