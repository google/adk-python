# ADK Evaluation Configuration for GCP Security Agent
# Run with: adk eval run --eval-config evals/security_agent_eval.yaml

name: "GCP Security Agent Evaluation"
description: "Test all 32 tools and agent capabilities"

# Agent configuration
agent:
  module_path: "agents.agent"
  class_name: "security_agent"

# Test scenarios
test_cases:
  # BigQuery Tools Tests
  - name: "Test Security Insights Summary"
    description: "Verify agent can get security insights summary"
    input: "Show me a summary of security insights"
    expected_tools: ["get_security_insights_summary"]

  - name: "Test BigQuery Query"
    description: "Verify agent can run BigQuery queries"
    input: "Query the security_insights table for the last 10 findings"
    expected_tools: ["run_query"]

  - name: "Test Table Exploration"
    description: "Verify agent can explore tables"
    input: "Show me the schema of the security_insights table"
    expected_tools: ["get_table_schema"]

  # Service Evaluation Tests
  - name: "Test Service Compliance Check"
    description: "Verify agent can check service compliance"
    input: "Evaluate BigQuery for PCI-DSS compliance"
    expected_tools: ["check_service_compliance"]

  - name: "Test New Service Evaluation"
    description: "Verify agent can evaluate new services"
    input: "Evaluate Cloud Run as a new service for security"
    expected_tools: ["evaluate_new_service"]

  # Service Discovery Tests
  - name: "Test Service Discovery"
    description: "Verify agent can discover GCP services"
    input: "Discover available GCP services"
    expected_tools: ["discover_gcp_services"]

  - name: "Test Service Analysis"
    description: "Verify agent can analyze services"
    input: "Analyze the Cloud Storage service"
    expected_tools: ["analyze_gcp_service"]

  # Confluence Tools Tests
  - name: "Test Documentation Search"
    description: "Verify agent can search Confluence"
    input: "Search Confluence for security policies"
    expected_tools: ["search_confluence_documentation"]

  - name: "Test Documentation Analysis"
    description: "Verify agent can analyze documentation coverage"
    input: "Analyze Confluence documentation coverage"
    expected_tools: ["analyze_confluence_coverage"]

  # Feed Tools Tests
  - name: "Test Release Notes Query"
    description: "Verify agent can query GCP release notes"
    input: "What are the latest GCP security updates?"
    expected_tools: ["query_gcp_release_notes"]

  - name: "Test Security Feed Query"
    description: "Verify agent can query security feeds"
    input: "Show me recent security threats from feeds"
    expected_tools: ["query_security_threat_feeds"]

  # Multi-tool Complex Scenarios
  - name: "Test Complex Compliance Workflow"
    description: "Verify agent can handle multi-step compliance check"
    input: "Check if we have any Cloud Run services and evaluate them for SOC2 compliance"
    expected_tools: ["discover_gcp_services", "check_service_compliance"]

  - name: "Test Security Posture Analysis"
    description: "Verify agent can analyze overall security posture"
    input: "Give me a complete security posture report including BigQuery insights, compliance status, and recent threats"
    expected_tools: ["get_security_insights_summary", "get_security_statistics", "query_security_threat_feeds"]

# Evaluation criteria
evaluation_criteria:
  tool_usage:
    weight: 0.4
    description: "Agent uses correct tools for the task"

  response_quality:
    weight: 0.3
    description: "Response is accurate and helpful"

  multi_tool_coordination:
    weight: 0.2
    description: "Agent coordinates multiple tools effectively"

  error_handling:
    weight: 0.1
    description: "Agent handles errors gracefully"

# Success criteria
success_threshold: 0.75

# Timeout per test case (seconds)
timeout: 120
