version: '3.8'

services:
  backend:
    build: .
    container_name: adk-security-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account.json
      - DATABASE_PATH=/app/backend/cache/gcp_data.db
      - BACKEND_PORT=8000
      - DATA_REFRESH_INTERVAL=1800
    volumes:
      - ./backend/cache:/app/backend/cache
      - ./logs:/app/logs
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/credentials/service-account.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: adk-security-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - FRONTEND_PORT=8501
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cache_data:
  log_data: