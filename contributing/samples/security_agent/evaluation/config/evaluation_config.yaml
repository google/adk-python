# ADK Agent Evaluation Configuration
evaluation:
  # Global evaluation settings
  num_runs: 3
  timeout_seconds: 300
  parallel_execution: true
  
  # Metrics configuration
  metrics:
    # ADK Standard Metrics
    tool_trajectory:
      enabled: true
      weight: 0.4
      threshold: 0.9
    
    response_match:
      enabled: true
      weight: 0.3
      threshold: 0.8
    
    response_evaluation:
      enabled: true
      weight: 0.3
      threshold: 0.75
    
    # Security-Specific Metrics
    security_accuracy:
      enabled: true
      weight: 0.5
      threshold: 0.85
      
    vulnerability_detection:
      enabled: true
      weight: 0.4
      threshold: 0.9
      
    compliance_coverage:
      enabled: true
      weight: 0.3
      threshold: 0.9
      
    risk_assessment:
      enabled: true
      weight: 0.2
      threshold: 0.8

  # Agent-specific configurations
  agents:
    security_agent:
      datasets:
        - "vulnerability_assessment.test.json"
        - "compliance_check.test.json"
        - "incident_response.test.json"
      custom_metrics:
        - "security_accuracy_score"
        - "vulnerability_detection_score"
    
    compliance_agent:
      datasets:
        - "compliance_check.test.json"
      custom_metrics:
        - "compliance_coverage_score"

# Dataset configurations
datasets:
  vulnerability_assessment:
    name: "Vulnerability Assessment Evaluation"
    description: "Tests agent ability to identify and analyze security vulnerabilities"
    sample_size: 50
    categories:
      - "sql_injection"
      - "xss"
      - "authentication_bypass"
      - "privilege_escalation"
      - "data_exposure"
  
  compliance_check:
    name: "Compliance Checking Evaluation" 
    description: "Tests agent compliance analysis capabilities"
    sample_size: 30
    frameworks:
      - "SOC2"
      - "PCI_DSS"
      - "GDPR"
      - "HIPAA"
  
  incident_response:
    name: "Incident Response Evaluation"
    description: "Tests agent incident handling and response capabilities"
    sample_size: 25
    scenarios:
      - "data_breach"
      - "malware_infection"
      - "ddos_attack"
      - "insider_threat"

# Reporting configuration
reporting:
  output_formats:
    - "json"
    - "html"
    - "csv"
  
  include_details: true
  include_traces: true
  benchmark_comparison: true
  
  export_path: "evaluation/results"