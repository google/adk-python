# Google Cloud Run Configuration
# Optimized for production workloads with security and performance best practices

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: security-agent
  namespace: default
  labels:
    app: security-agent
    version: v1.13.0
    environment: production
  annotations:
    # Cloud Run specific annotations
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/client-name: security-agent
    run.googleapis.com/client-version: 1.13.0
    # Security annotations
    run.googleapis.com/binary-authorization: default
    run.googleapis.com/sandbox: gvisor
spec:
  template:
    metadata:
      labels:
        app: security-agent
        version: v1.13.0
      annotations:
        # Scaling configuration
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        autoscaling.knative.dev/target: "70"
        
        # Resource allocation
        run.googleapis.com/cpu: "2"
        run.googleapis.com/memory: "4Gi"
        run.googleapis.com/execution-environment: gen2
        
        # Security settings
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-connector: security-agent-connector
        run.googleapis.com/vpc-access-egress: all-traffic
        
        # Session affinity and timeout
        run.googleapis.com/timeout: "300s"
        run.googleapis.com/sessionAffinity: false
        
        # Startup and health checks
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 300
      serviceAccountName: security-agent-sa@PROJECT_ID.iam.gserviceaccount.com
      
      containers:
      - name: security-agent
        image: gcr.io/PROJECT_ID/security-agent:1.13.0
        
        ports:
        - name: http1
          containerPort: 8080
          protocol: TCP
        
        # Environment variables
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: APP_PORT
          value: "8080"
        - name: APP_HOST
          value: "0.0.0.0"
        - name: LOG_LEVEL
          value: "info"
        - name: GOOGLE_CLOUD_PROJECT_ID
          value: "PROJECT_ID"
        - name: GCP_REGION
          value: "us-central1"
        
        # Secrets from Secret Manager
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: security-agent-secrets
              key: secret_key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: security-agent-secrets
              key: jwt_secret
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: security-agent-secrets
              key: anthropic_api_key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: security-agent-secrets
              key: database_url
        
        # Resource requests and limits
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        
        # Startup probe
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
            httpHeaders:
            - name: User-Agent
              value: "Cloud-Run-Startup-Probe"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
          successThreshold: 1
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
            httpHeaders:
            - name: User-Agent
              value: "Cloud-Run-Liveness-Probe"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            httpHeaders:
            - name: User-Agent
              value: "Cloud-Run-Readiness-Probe"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
          successThreshold: 1
        
        # Volume mounts for persistent data
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: logs-volume
          mountPath: /app/logs
        - name: credentials-volume
          mountPath: /app/credentials
          readOnly: true
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETGID
            - SETUID
      
      # Volumes
      volumes:
      - name: data-volume
        emptyDir:
          sizeLimit: 1Gi
      - name: logs-volume
        emptyDir:
          sizeLimit: 500Mi
      - name: credentials-volume
        secret:
          secretName: security-agent-credentials
          defaultMode: 0400
  
  traffic:
  - percent: 100
    latestRevision: true

---
# IAM Policy for Cloud Run Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-agent-iam-policy
  namespace: default
data:
  policy.yaml: |
    bindings:
    - members:
      - allUsers
      role: roles/run.invoker
      condition:
        title: "Rate limit"
        description: "Limit requests per minute"
        expression: "request.time.getHours() >= 0 && request.time.getHours() <= 23"
    - members:
      - serviceAccount:security-agent-sa@PROJECT_ID.iam.gserviceaccount.com
      role: roles/cloudsql.client
    - members:
      - serviceAccount:security-agent-sa@PROJECT_ID.iam.gserviceaccount.com
      role: roles/secretmanager.secretAccessor
    - members:
      - serviceAccount:security-agent-sa@PROJECT_ID.iam.gserviceaccount.com
      role: roles/storage.objectViewer

---
# Service Account for Cloud Run
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-agent-sa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: security-agent-sa@PROJECT_ID.iam.gserviceaccount.com

---
# Network Policy for VPC connector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-agent-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: security-agent
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis