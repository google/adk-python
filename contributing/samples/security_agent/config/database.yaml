# Database Configuration - SQLite Optimization
# Production-ready SQLite configuration with performance tuning

# SQLite Configuration
sqlite:
  # Database file path
  database_path: "./data/security_agent.db"
  
  # Connection settings
  connection:
    # Connection pool configuration
    pool_size: 20
    max_overflow: 30
    pool_pre_ping: true
    pool_recycle: 3600  # 1 hour
    pool_timeout: 30
    
    # Connection string options
    connect_args:
      check_same_thread: false
      timeout: 30
      isolation_level: null  # Use autocommit mode
      
    # SQLite-specific pragmas for optimization
    pragma:
      # Performance optimizations
      journal_mode: WAL  # Write-Ahead Logging for better concurrency
      synchronous: NORMAL  # Balance between safety and performance
      cache_size: -64000  # 64MB cache (negative value = KB)
      temp_store: MEMORY  # Store temporary tables in memory
      mmap_size: 268435456  # 256MB memory-mapped I/O
      
      # Security settings
      secure_delete: true
      
      # Reliability settings
      foreign_keys: true
      auto_vacuum: INCREMENTAL
      page_size: 4096
      
      # WAL mode optimizations
      wal_autocheckpoint: 1000
      wal_checkpoint_fullfsync: true
      
      # Query optimization
      optimize: true
      analysis_limit: 1000
      
  # Backup configuration
  backup:
    enabled: true
    interval_hours: 6
    retention_days: 30
    backup_directory: "./backups/db"
    compress: true
    verify_integrity: true
    
    # Backup naming convention
    filename_pattern: "security_agent_{timestamp}.db"
    
    # WAL file handling during backup
    checkpoint_before_backup: true
    
  # Maintenance settings
  maintenance:
    # Auto-vacuum settings
    auto_vacuum_enabled: true
    incremental_vacuum_pages: 100
    
    # Statistics and optimization
    analyze_frequency: "daily"
    reindex_frequency: "weekly"
    
    # Integrity checks
    integrity_check_frequency: "daily"
    quick_check_enabled: true
    
    # Maintenance window (24-hour format)
    maintenance_window:
      start_hour: 2
      end_hour: 4
      
  # Monitoring and logging
  monitoring:
    log_slow_queries: true
    slow_query_threshold: 1000  # milliseconds
    log_level: "INFO"
    
    # Performance metrics
    collect_metrics: true
    metrics_interval: 300  # seconds
    
    # Connection monitoring
    log_connections: false
    connection_timeout_warning: 15  # seconds

# Query optimization settings
query_optimization:
  # Query caching
  enable_query_cache: true
  query_cache_size: 100
  query_cache_ttl: 3600  # seconds
  
  # Statement preparation
  use_prepared_statements: true
  statement_cache_size: 200
  
  # Transaction settings
  default_transaction_mode: "IMMEDIATE"
  transaction_timeout: 30  # seconds
  
  # Batch processing
  batch_size: 1000
  bulk_insert_threshold: 100
  
# Schema management
schema:
  # Migration settings
  auto_migrate: true
  migration_timeout: 300  # seconds
  
  # Version tracking
  version_table: "schema_migrations"
  track_schema_changes: true
  
  # Index management
  auto_create_indexes: true
  index_optimization: true
  
# Security configuration
security:
  # Encryption (if using SQLCipher extension)
  encryption:
    enabled: false  # Set to true if using SQLCipher
    key_derivation_iterations: 64000
    cipher_page_size: 4096
    
  # Access control
  read_only_mode: false
  allow_extension_loading: false
  
  # Audit settings
  audit_enabled: true
  audit_table: "audit_log"
  audit_operations: ["INSERT", "UPDATE", "DELETE"]
  
# Error handling
error_handling:
  # Retry configuration
  max_retries: 3
  retry_delay: 1  # seconds
  exponential_backoff: true
  
  # Error logging
  log_database_errors: true
  error_log_file: "./logs/database_errors.log"
  
  # Recovery settings
  auto_recovery: true
  corruption_recovery_mode: "REPAIR"
  
# Development settings (override in production)
development:
  # Debug settings
  echo_sql: false
  log_queries: false
  
  # Test database
  test_database_path: "./data/test_security_agent.db"
  
  # Seeding
  seed_data_enabled: false
  seed_data_file: "./config/seed_data.sql"
  
# Production overrides
production:
  # Stricter settings for production
  sqlite:
    pragma:
      synchronous: FULL  # Maximum safety
      secure_delete: true
      
  # Enhanced monitoring
  monitoring:
    log_level: "WARNING"
    collect_metrics: true
    
  # Backup settings
  backup:
    interval_hours: 4  # More frequent backups
    verify_integrity: true
    
# Environment-specific configurations
environments:
  development:
    sqlite:
      database_path: "./data/dev_security_agent.db"
      pragma:
        synchronous: OFF  # Faster for development
        journal_mode: DELETE
    monitoring:
      log_slow_queries: false
      
  test:
    sqlite:
      database_path: ":memory:"  # In-memory database for tests
      pragma:
        synchronous: OFF
        journal_mode: MEMORY
    backup:
      enabled: false
      
  staging:
    sqlite:
      database_path: "./data/staging_security_agent.db"
      pragma:
        synchronous: NORMAL
        journal_mode: WAL
    backup:
      interval_hours: 12
      
# Connection string templates
connection_strings:
  sqlite_basic: "sqlite:///{database_path}"
  sqlite_with_options: "sqlite:///{database_path}?check_same_thread=false&timeout={timeout}"
  sqlite_memory: "sqlite:///:memory:"
  sqlite_shared_cache: "sqlite:///{database_path}?cache=shared"
  
# Health check configuration
health_checks:
  enabled: true
  interval: 30  # seconds
  timeout: 5   # seconds
  
  checks:
    - name: "connection"
      query: "SELECT 1"
    - name: "disk_space"
      min_free_space_mb: 1000
    - name: "wal_size"
      max_wal_size_mb: 100
    - name: "integrity"
      frequency: "hourly"
      query: "PRAGMA quick_check"