# Prometheus Configuration for Security Agent Monitoring
# Optimized for production monitoring with comprehensive metrics collection

global:
  # How frequently to scrape targets by default
  scrape_interval: 15s
  
  # How long until a scrape request times out
  scrape_timeout: 10s
  
  # How frequently to evaluate rules
  evaluation_interval: 15s
  
  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    monitor: 'security-agent-monitor'
    environment: 'production'
    datacenter: 'us-central1'
    cluster: 'security-agent-cluster'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'
rule_files:
  - "rules/security_agent_rules.yml"
  - "rules/infrastructure_rules.yml"
  - "rules/performance_rules.yml"
  - "rules/security_rules.yml"

# Scrape configuration
scrape_configs:
  # Security Agent Application Metrics
  - job_name: 'security-agent-app'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets:
        - 'security-agent:8080'
        - 'security-agent:9090'  # metrics port
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: '([^:]+):.+'
        target_label: host
        replacement: '${1}'
    metric_relabel_configs:
      # Drop high cardinality metrics
      - source_labels: [__name__]
        regex: 'go_memstats_.*'
        action: drop

  # Database Metrics (SQLite)
  - job_name: 'sqlite-exporter'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets:
        - 'sqlite-exporter:9200'
    relabel_configs:
      - source_labels: [__address__]
        target_label: db_instance

  # System Metrics (Node Exporter)
  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
        - 'node-exporter:9100'
    relabel_configs:
      - source_labels: [__address__]
        target_label: node

  # Container Metrics (cAdvisor)
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
        - 'cadvisor:8080'
    metric_relabel_configs:
      # Only collect metrics for security-agent containers
      - source_labels: [container_label_com_docker_compose_service]
        regex: 'security-agent.*'
        action: keep

  # Redis Metrics
  - job_name: 'redis-exporter'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
        - 'redis-exporter:9121'
    relabel_configs:
      - source_labels: [__address__]
        target_label: redis_instance

  # Nginx Metrics
  - job_name: 'nginx-exporter'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
        - 'nginx-exporter:9113'

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
        - 'localhost:9090'

  # Alertmanager Metrics
  - job_name: 'alertmanager'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets:
        - 'alertmanager:9093'

  # Grafana Metrics
  - job_name: 'grafana'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets:
        - 'grafana:3000'

  # Blackbox Exporter for External Monitoring
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - 'https://security-agent.yourdomain.com/health'
        - 'https://security-agent.yourdomain.com/api/health'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # SSL Certificate Monitoring
  - job_name: 'blackbox-ssl'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - 'https://security-agent.yourdomain.com:443'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Custom Application Metrics
  - job_name: 'security-agent-custom'
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    static_configs:
      - targets:
        - 'security-agent:8080'
    basic_auth:
      username: 'metrics'
      password_file: '/etc/prometheus/metrics_password'

  # Google Cloud Monitoring (if applicable)
  - job_name: 'gcp-metrics'
    metrics_path: '/metrics'
    scrape_interval: 60s
    static_configs:
      - targets:
        - 'stackdriver-exporter:9255'
    metric_relabel_configs:
      # Only collect relevant GCP metrics
      - source_labels: [__name__]
        regex: 'stackdriver_.*compute.*|stackdriver_.*storage.*|stackdriver_.*sql.*'
        action: keep

# Remote storage configuration (optional)
remote_write:
  - url: "https://prometheus-remote-storage.yourdomain.com/api/v1/write"
    queue_config:
      max_samples_per_send: 10000
      max_shards: 200
      capacity: 100000
    write_relabel_configs:
      # Only send critical metrics to remote storage
      - source_labels: [__name__]
        regex: '(up|security_agent_.*|http_requests_total|http_request_duration_seconds)'
        action: keep

# Storage configuration
storage:
  tsdb:
    path: /prometheus/data
    retention.time: 30d
    retention.size: 10GB
    min-block-duration: 2h
    max-block-duration: 25h
    no-lockfile: false
    wal-compression: true

# Query configuration
query:
  timeout: 2m
  max-concurrency: 20
  max-samples: 50000000
  lookback-delta: 5m

# Web configuration
web:
  console.libraries: /usr/share/prometheus/console_libraries
  console.templates: /usr/share/prometheus/consoles
  enable-lifecycle: true
  enable-admin-api: false
  max-connections: 512
  read-timeout: 30s
  external-url: http://prometheus.yourdomain.com

# Feature flags
feature_flags:
  - promql-at-modifier
  - promql-negative-offset
  - remote-write-receiver

# Service discovery configurations (for dynamic environments)
scrape_config_files:
  - "/etc/prometheus/conf.d/*.yml"

# Additional configuration for security
security:
  basic_auth:
    enabled: true
    username: admin
    password_file: /etc/prometheus/web_password
  
  tls:
    enabled: false  # Enable if using HTTPS
    cert_file: /etc/prometheus/tls/prometheus.crt
    key_file: /etc/prometheus/tls/prometheus.key

# Log configuration
log:
  level: info
  format: json

# Tracing configuration (optional)
tracing:
  enabled: false
  endpoint: "http://jaeger:14268/api/traces"
  sampling_ratio: 0.1