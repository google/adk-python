name: 'CSAT survey for ADK-Python'
on:
  issues:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  welcome:
    name: Run CSAT survey script
    if: >-
      github.repository == 'google/adk-python' &&
      github.event.issue.state_reason == 'completed' &&
      !contains(github.event.issue.labels.*.name, 'stale') &&
      github.event.sender.login != 'adk-bot' &&
      !endsWith(github.event.sender.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Required for csat script to comment on closed issues
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const script = require('./.github/scripts/csat.js')
            await script({github, context})
