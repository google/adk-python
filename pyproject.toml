[project]
# Project metadata. Available keys are documented at:
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata

name = "google-adk"
description = "Agent Development Kit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Google LLC", email = "googleapis-packages@google.com" }]
classifiers = [ # List of https://pypi.org/classifiers/
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  # go/keep-sorted start
  "PyYAML>=6.0.2, <7.0.0",                                   # For APIHubToolset.
  "aiosqlite>=0.21.0",                                       # For SQLite database
  "anyio>=4.9.0, <5.0.0",                                    # For MCP Session Manager
  "authlib>=1.6.6, <2.0.0",                                  # For RestAPI Tool
  "click>=8.1.8, <9.0.0",                                    # For CLI tools
  "fastapi>=0.124.1, <1.0.0",                                # FastAPI framework
  "google-api-python-client>=2.157.0, <3.0.0",               # Google API client discovery
  "google-auth[pyopenssl]>=2.47.0",                          # Google Auth library
  "google-cloud-aiplatform[agent_engines]>=1.148.0, <2.0.0", # For VertexAI integrations, e.g. example store.
  "google-cloud-bigquery-storage>=2.0.0",
  "google-cloud-bigquery>=2.2.0",
  "google-cloud-bigtable>=2.32.0",                           # For Bigtable database
  "google-cloud-dataplex>=1.7.0,<3.0.0",                    # For Dataplex Catalog Search tool
  "google-cloud-discoveryengine>=0.13.12, <0.14.0",          # For Discovery Engine Search Tool
  "google-cloud-pubsub>=2.0.0, <3.0.0",                      # For Pub/Sub Tool
  "google-cloud-secret-manager>=2.22.0, <3.0.0",             # Fetching secrets in RestAPI Tool
  "google-cloud-spanner>=3.56.0, <4.0.0",                    # For Spanner database
  "google-cloud-speech>=2.30.0, <3.0.0",                     # For Audio Transcription
  "google-cloud-storage>=2.18.0, <4.0.0",                    # For GCS Artifact service
  "google-genai>=1.72.0, <2.0.0",                            # Google GenAI SDK
  "graphviz>=0.20.2, <1.0.0",                                # Graphviz for graph rendering
  "httpx>=0.27.0, <1.0.0",                                   # HTTP client library
  "jsonschema>=4.23.0, <5.0.0",                              # Agent Builder config validation
  "mcp>=1.24.0, <2.0.0",                                     # For MCP Toolset
  "opentelemetry-api>=1.36.0, <1.39.0",                      # OpenTelemetry - keep below 1.39.0 due to current agent_engines exporter constraints.
  "opentelemetry-exporter-gcp-logging>=1.9.0a0, <2.0.0",
  "opentelemetry-exporter-gcp-monitoring>=1.9.0a0, <2.0.0",
  "opentelemetry-exporter-gcp-trace>=1.9.0, <2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0",
  "opentelemetry-resourcedetector-gcp>=1.9.0a0, <2.0.0",
  "opentelemetry-sdk>=1.36.0, <1.39.0",
  "pyarrow>=14.0.0",
  "pydantic>=2.12.0, <3.0.0",                                 # For data validation/models
  "python-dateutil>=2.9.0.post0, <3.0.0",                    # For Vertext AI Session Service
  "python-dotenv>=1.0.0, <2.0.0",                            # To manage environment variables
  "requests>=2.32.4, <3.0.0",
  "sqlalchemy-spanner>=1.14.0",                              # Spanner database session service
  "sqlalchemy>=2.0, <3.0.0",                                 # SQL database ORM
  "starlette>=0.49.1, <1.0.0",                               # For FastAPI CLI
  "tenacity>=9.0.0, <10.0.0",                                # For Retry management
  "typing-extensions>=4.5, <5",
  "tzlocal>=5.3, <6.0",                                      # Time zone utilities
  "uvicorn>=0.34.0, <1.0.0",                                 # ASGI server for FastAPI
  "watchdog>=6.0.0, <7.0.0",                                 # For file change detection and hot reload
  "websockets>=15.0.1, <16.0.0",                             # For BaseLlmFlow
  # go/keep-sorted end
]
dynamic = ["version"]

[project.urls]
homepage = "https://google.github.io/adk-docs/"
repository = "https://github.com/google/adk-python"
changelog = "https://github.com/google/adk-python/blob/main/CHANGELOG.md"
documentation = "https://google.github.io/adk-docs/"

[project.scripts]
adk = "google.adk.cli:main"

[project.optional-dependencies]

dev = [
  # go/keep-sorted start
  "flit>=3.10.0",
  "isort>=6.0.0",
  "mypy>=1.15.0",
  "pyink>=25.12.0",
  "pylint>=2.6.0",
  # go/keep-sorted end
]

a2a = [
  # go/keep-sorted start
  "a2a-sdk>=0.3.4,<0.4.0",
  # go/keep-sorted end
]

community = [
  # go/keep-sorted start
  "google-adk-community",
  # go/keep-sorted end
]

eval = [
  # go/keep-sorted start
  "Jinja2>=3.1.4,<4.0.0",                         # For eval template rendering
  "gepa>=0.1.0",
  "google-cloud-aiplatform[evaluation]>=1.148.0",
  "pandas>=2.2.3",
  "rouge-score>=0.1.2",
  "tabulate>=0.9.0",
  # go/keep-sorted end
]

test = [
  # go/keep-sorted start
  "a2a-sdk>=0.3.0,<0.4.0",
  "anthropic>=0.43.0",                            # For anthropic model tests
  "crewai[tools];python_version>='3.11' and python_version<'3.12'",         # For CrewaiTool tests; chromadb/pypika fail on 3.12+
  "google-cloud-firestore>=2.11.0, <3.0.0",
  "google-cloud-iamconnectorcredentials>=0.1.0, <0.2.0",
  "google-cloud-parametermanager>=0.4.0, <1.0.0",
  "kubernetes>=29.0.0",                           # For GkeCodeExecutor
  "langchain-community>=0.3.17",
  "langgraph>=0.2.60, <0.4.8",                    # For LangGraphAgent
  "litellm>=1.75.5, <=1.82.6",                      # For LiteLLM tests. Upper bound pinned: versions 1.82.7+ compromised in supply chain attack.
  "llama-index-readers-file>=0.4.0",              # For retrieval tests
  "openai>=1.100.2",                              # For LiteLLM
  "opentelemetry-instrumentation-google-genai>=0.3b0, <1.0.0",
  "pypika>=0.50.0",                               # For crewai->chromadb dependency
  "pytest-asyncio>=0.25.0",
  "pytest-mock>=3.14.0",
  "pytest-xdist>=3.6.1",
  "pytest>=9.0.0,<10.0.0",
  "python-multipart>=0.0.9",
  "rouge-score>=0.1.2",
  "slack-bolt>=1.22.0",
  "tabulate>=0.9.0",
  # go/keep-sorted end
]

docs = [
  "autodoc_pydantic",
  "furo",
  "myst-parser",
  "sphinx<9.0.0",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
]

# Optional extensions
extensions = [
  "anthropic>=0.43.0",                          # For anthropic model support
  "beautifulsoup4>=3.2.2",                      # For load_web_page tool.
  "crewai[tools];python_version>='3.11' and python_version<'3.12'",       # For CrewaiTool; chromadb/pypika fail on 3.12+
  "docker>=7.0.0",                              # For ContainerCodeExecutor
  "google-cloud-firestore>=2.11.0, <3.0.0",             # For Firestore services
  "google-cloud-parametermanager>=0.4.0, <1.0.0",
  "kubernetes>=29.0.0",                         # For GkeCodeExecutor
  "k8s-agent-sandbox>=0.1.1.post3",             # For GkeCodeExecutor sandbox mode
  "langgraph>=0.2.60, <0.4.8",                  # For LangGraphAgent
  "litellm>=1.75.5, <=1.82.6",                    # For LiteLlm class. Upper bound pinned: versions 1.82.7+ compromised in supply chain attack.
  "llama-index-readers-file>=0.4.0",            # For retrieval using LlamaIndex.
  "llama-index-embeddings-google-genai>=0.3.0", # For files retrieval using LlamaIndex.
  "lxml>=5.3.0",                                # For load_web_page tool.
  "pypika>=0.50.0",                             # For crewai->chromadb dependency
  "toolbox-adk>=1.0.0, <2.0.0",                 # For tools.toolbox_toolset.ToolboxToolset
]

otel-gcp = ["opentelemetry-instrumentation-google-genai>=0.6b0, <1.0.0"]

toolbox = ["toolbox-adk>=1.0.0, <2.0.0"]

slack = ["slack-bolt>=1.22.0"]

agent-identity = [
  "google-cloud-iamconnectorcredentials>=0.1.0, <0.2.0",
]

[tool.pyink]
# Format py files following Google style-guide
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "mypy:",
  "pyright:",
  "pyre-",
]


[build-system]
# Build system specify which backend is used to build/install the project (flit,
# poetry, setuptools,...). All backends are supported by `pip install`
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"


[tool.flit.sdist]
include = ['src/**/*', 'README.md', 'pyproject.toml', 'LICENSE']
exclude = ['src/**/*.sh']


[tool.flit.module]
name = "google.adk"
include = ["py.typed"]


[tool.isort]
profile = "google"
single_line_exclusions = []
line_length = 200                  # Prevent line wrap flickering.
known_third_party = ["google.adk"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.10"
exclude = ["tests/", "contributing/samples/"]
plugins = ["pydantic.mypy"]
strict = true
disable_error_code = ["import-not-found", "import-untyped", "unused-ignore"]
follow_imports = "skip"


[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

# ruff.lint.ignore - 现有代码豁免清单
# ========================================
# 这些规则被豁免是因为现有代码存在大量违反情况。
# 后续应该逐步收敛，新代码应遵守这些规则。
#
# 收敛策略建议：
# 1. 新代码必须遵守所有规则（不添加新的 noqa）
# 2. 按优先级逐步修复现有代码：
#    - 高优先级：F 系列（逻辑错误）、B 系列（潜在 bug）
#    - 中优先级：SIM 系列（代码简化）、C4 系列（理解性简化）
#    - 低优先级：UP 系列（Python 版本升级）、E 系列（风格）
# 3. 每修复一类问题，从 ignore 列表中移除对应规则

lint.ignore = [
  # UP 系列 (pyupgrade) - Python 版本升级相关
  # 现有代码大量使用 Python 3.10 风格的类型注解，
  # 这些规则要求升级到 PEP 585/PEP 604 风格
  "UP006",   # non-pep585-annotation: List[str] -> list[str]
  "UP007",   # non-pep604-annotation-union: Union[str, int] -> str | int
  "UP008",   # super-call-with-parameters: super() -> super(ClassName, self)
  "UP012",   # unnecessary-encode-utf8: .encode("utf-8") is default
  "UP015",   # redundant-open-modes: open(..., "r") is default
  "UP024",   # os-error-alias: IOError, OSError -> OSError
  "UP028",   # yield-in-for-loop: yield from iterable
  "UP031",   # printf-string-formatting: % formatting -> f-strings
  "UP032",   # f-string: .format() -> f-strings
  "UP034",   # extraneous-parentheses: 冗余括号
  "UP035",   # deprecated-import: typing.Dict etc. -> collections.abc
  "UP037",   # quoted-annotation: 使用 from __future__ import annotations
  "UP045",   # non-pep604-annotation-optional: Optional[str] -> str | None

  # I 系列 (isort) - 导入排序
  "I001",    # unsorted-imports: 项目已使用 isort，有独立配置

  # F 系列 (pyflakes) - 逻辑错误
  "F401",    # unused-import: 存在有意的重导出 (re-exports)
  "F402",    # import-shadowed-by-loop-var: 循环变量覆盖导入
  "F403",    # undefined-local-with-import-star: from module import *
  "F541",    # f-string-missing-placeholders: f-string 无占位符
  "F601",    # multi-value-repeated-key-literal: 字典重复键
  "F811",    # redefined-while-unused: 重定义未使用的变量
  "F821",    # undefined-name: 未定义的名称（可能在类型注解中）
  "F841",    # unused-variable: 未使用的变量

  # E 系列 (pycodestyle) - 风格错误
  "E501",    # line-too-long: 行太长（项目用 80 字符，ruff 配置 100）
  "E402",    # module-import-not-at-top-of-file: 导入不在文件顶部
  "E711",    # none-comparison: x == None -> x is None
  "E712",    # true-false-comparison: x == True -> x is True
  "E721",    # type-comparison: type(x) == Y -> isinstance(x, Y)
  "E731",    # lambda-assignment: 赋值 lambda 到变量

  # B 系列 (flake8-bugbear) - 潜在 bug
  "B004",    # unreliable-callable-check: 不可靠的可调用检查
  "B005",    # strip-with-multi-characters: .strip() 多字符问题
  "B006",    # mutable-argument-default: 可变默认参数
  "B007",    # unused-loop-control-variable: 未使用的循环控制变量
  "B008",    # function-call-in-default-argument: 默认参数中的函数调用
  "B009",    # get-attr-with-constant: getattr(x, "foo") -> x.foo
  "B010",    # set-attr-with-constant: setattr 常量值
  "B011",    # assert-false: assert False 总是失败
  "B015",    # useless-comparison: 无用比较
  "B017",    # assert-raises-exception: assertRaises(Exception) 太宽泛
  "B023",    # function-uses-loop-variable: 闭包使用循环变量
  "B024",    # abstract-base-class-without-abstract-method: 无抽象方法的 ABC
  "B027",    # empty-method-without-abstract-decorator: 空方法无 abstractmethod
  "B028",    # no-explicit-stacklevel: warn() 无 stacklevel
  "B904",    # raise-without-from-inside-except: except 中 raise 无 from
  "B905",    # zip-without-explicit-strict: zip() 无 strict=

  # SIM 系列 (flake8-simplify) - 代码简化
  "SIM101",  # duplicate-isinstance-call: 重复 isinstance 调用
  "SIM102",  # collapsible-if: 可合并的 if 嵌套
  "SIM103",  # needless-bool: 不必要的 bool() 调用
  "SIM105",  # suppressible-exception: 可用 contextlib.suppress
  "SIM108",  # if-else-block-instead-of-if-exp: 可用三元表达式
  "SIM110",  # reimplemented-builtin: 重新实现了内置函数
  "SIM113",  # enumerate-for-loop: 可用 enumerate()
  "SIM114",  # if-with-same-arms: if 分支相同
  "SIM117",  # multiple-with-statements: 多个 with 可合并
  "SIM118",  # in-dict-keys: x in dict.keys() -> x in dict
  "SIM300",  # magic-values: 测试中的魔法值
  "SIM401",  # if-else-block-instead-of-dict-get: 可用 dict.get()
  "SIM910",  # dict-get-with-none-default: .get(x, None) 是默认

  # C4 系列 (flake8-comprehensions) - 推导式简化
  "C401",    # unnecessary-generator-set: set(generator) -> {x for x in ...}
  "C403",    # unnecessary-list-comprehension-set: set([...]) -> {...}
  "C405",    # unnecessary-literal-set: set((1, 2)) -> {1, 2}
  "C408",    # unnecessary-collection-call: dict() -> {}
  "C410",    # unnecessary-literal-within-list-call: list((1, 2)) -> [1, 2]
  "C413",    # unnecessary-call-around-sorted: list(sorted(...)) -> sorted(...)
  "C414",    # unnecessary-double-cast-or-process: 冗余转换
  "C416",    # unnecessary-comprehension: [x for x in iter] -> list(iter)
  "C419",    # unnecessary-comprehension-in-call: sum(x for x in ...) 无括号
  "C420",    # unnecessary-dict-comprehension-for-iterable: {k:v for k,v in ...}

  # W 系列 (pycodestyle) - 空白相关
  "W291",    # trailing-whitespace: 尾随空格
  "W293",    # blank-line-with-whitespace: 空白行有空格
]

[tool.ruff.lint.per-file-ignores]
"contributing/samples/**/*.py" = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
